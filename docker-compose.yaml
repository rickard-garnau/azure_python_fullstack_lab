services:
  backend:
    image: acrrickardgarnau.azurecr.io/backend:latest
    container_name: backend
    build:
      context: .
      dockerfile: dockerfiles/backend.dockerfile
    ports:
      - "8000:8000"
    
  frontend:
    image:  acrrickardgarnau.azurecr.io/frontend:latest
    container_name: frontend
    build:
      context: .
      dockerfile: dockerfiles/frontend.dockerfile
    ports:
    - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000